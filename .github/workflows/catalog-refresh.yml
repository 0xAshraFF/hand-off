name: Nightly catalog refresh

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh pricing and source checks
        run: bun run catalog:refresh

      - name: Commit catalog snapshot if changed
        run: |
          if git diff --quiet -- data/catalog.snapshot.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "handoff-catalog-bot"
          git config user.email "handoff-catalog-bot@users.noreply.github.com"
          git add data/catalog.snapshot.json
          git commit -m "chore: nightly catalog refresh"
          git push
