name: Nightly catalog refresh

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Refresh catalog
        run: pnpm run catalog:refresh
      - name: Validate refreshed snapshot
        run: pnpm test && pnpm run build
      - name: Commit tracked catalog snapshot and history if changed
        shell: bash
        run: |
          git add -u -- data
          if git diff --cached --quiet -- data; then
            echo "No tracked catalog changes."
            exit 0
          fi
          git config user.name "handoff-catalog-bot"
          git config user.email "handoff-catalog-bot@users.noreply.github.com"
          git commit -m "chore: nightly catalog refresh"
          git push
